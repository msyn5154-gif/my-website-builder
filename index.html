
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY WEBSITE BUILDER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10121b;color:white;font-family:Arial}
header{padding:18px;background:#1c2030;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:bold;color:#9288ff}
button{border:0;border-radius:8px;padding:12px;background:#7166ed;color:white;font-weight:bold;margin:3px}
input{padding:12px;border-radius:8px;border:1px solid #555;background:#171a27;color:white;width:100%;margin:6px 0}
.container{padding:16px;max-width:900px;margin:auto}
.panel{background:#1d2130;padding:17px;border-radius:12px;margin:12px 0}
.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.card{background:#292e40;padding:15px;border-radius:10px}
.canvas{background:white;color:#222;min-height:400px;padding:22px;border-radius:9px;overflow-wrap:anywhere}
.canvas [contenteditable=true]:focus{outline:2px dashed #7166ed}
.canvas img{max-width:100%}
.tools{display:flex;flex-wrap:wrap;gap:5px}
.tools button{flex:1}
.green{background:#159d6a}
small{color:#aaa}
</style>
</head>
<body>

<header>
<div class="logo">✦ MY BUILDER</div>
<button onclick="showHome()">หน้าหลัก</button>
</header>

<main class="container" id="home">
<h1>สร้างเว็บไซต์ของคุณเอง</h1>
<p>แพลตฟอร์มสร้างเว็บไซต์ออนไลน์</p>

<div class="panel">
<h3>เว็บไซต์ของฉัน</h3>
<div id="projects" class="grid"></div>
<button class="green" onclick="newProject()">＋ สร้างเว็บไซต์ใหม่</button>
</div>

<div class="panel">
<h3>วิธีใช้งาน</h3>
<p>1. สร้างเว็บไซต์ใหม่</p>
<p>2. เพิ่มข้อความ รูปภาพ และปุ่ม</p>
<p>3. แก้ไขหน้าตาเว็บไซต์</p>
<p>4. บันทึกและส่งออก</p>
</div>
</main>

<main class="container hidden" id="editor">
<h2>เครื่องมือแก้ไขเว็บไซต์</h2>

<div class="panel">
<label>ชื่อเว็บไซต์</label>
<input id="siteName" placeholder="ชื่อเว็บไซต์">
<label>สีพื้นหลัง</label>
<input type="color" id="bg" value="#ffffff" onchange="canvas.style.background=this.value">
</div>

<div class="panel">
<h3>เพิ่มองค์ประกอบ</h3>
<div class="tools">
<button onclick="add('heading')">＋ หัวข้อ</button>
<button onclick="add('text')">＋ ข้อความ</button>
<button onclick="add('button')">＋ ปุ่ม</button>
<button onclick="add('image')">＋ รูปภาพ</button>
</div>
</div>

<div class="panel">
<div style="display:flex;justify-content:space-between;align-items:center">
<b>ตัวอย่างเว็บไซต์</b>
<button class="green" onclick="saveProject()">บันทึก</button>
</div>
<div class="canvas" id="canvas">
<h1 contenteditable="true">ยินดีต้อนรับ</h1>
<p contenteditable="true">นี่คือเว็บไซต์ของฉัน</p>
</div>
</div>

<div class="panel">
<button onclick="exportProject()">ดาวน์โหลดเว็บไซต์</button>
<button onclick="showHome()">กลับหน้าหลัก</button>
</div>
</main>

<script>
let projects=JSON.parse(localStorage.getItem('builderProjects')||'[]');
let current=-1;
const home=document.getElementById('home');
const editor=document.getElementById('editor');
const canvas=document.getElementById('canvas');
const siteName=document.getElementById('siteName');

function persist(){
 localStorage.setItem('builderProjects',JSON.stringify(projects));
}

function render(){
 const box=document.getElementById('projects');
 box.innerHTML='';
 projects.forEach((p,i)=>{
  const card=document.createElement('div');
  card.className='card';
  const title=document.createElement('b');
  title.textContent=p.name;
  const open=document.createElement('button');
  open.textContent='เปิดแก้ไข';
  open.onclick=()=>openProject(i);
  const del=document.createElement('button');
  del.textContent='ลบ';
  del.onclick=()=>{
   if(confirm('ลบเว็บไซต์นี้?')){
    projects.splice(i,1);
    persist();
    render();
   }
  };
  card.append(title,document.createElement('br'),open,del);
  box.appendChild(card);
 });
}

function showHome(){
 editor.classList.add('hidden');
 home.classList.remove('hidden');
 render();
}

function newProject(){
 const name=prompt('ตั้งชื่อเว็บไซต์ของคุณ');
 if(!name||!name.trim())return;
 projects.push({
  name:name.trim(),
  content:'<h1 contenteditable="true">ยินดีต้อนรับ</h1><p contenteditable="true">นี่คือเว็บไซต์ของฉัน</p>',
  bg:'#ffffff'
 });
 persist();
 openProject(projects.length-1);
}

function openProject(i){
 current=i;
 const p=projects[i];
 siteName.value=p.name;
 canvas.innerHTML=p.content;
 canvas.style.background=p.bg||'#ffffff';
 document.getElementById('bg').value=p.bg||'#ffffff';
 home.classList.add('hidden');
 editor.classList.remove('hidden');
}

function add(type){
 let el;
 if(type==='heading'){
  el=document.createElement('h2');
  el.textContent='หัวข้อใหม่';
 }else if(type==='text'){
  el=document.createElement('p');
  el.textContent='พิมพ์ข้อความของคุณ';
 }else if(type==='button'){
  el=document.createElement('button');
  el.textContent='คลิกที่นี่';
  el.onclick=()=>alert('ปุ่มทำงานแล้ว');
 }else if(type==='image'){
  let url=prompt('ใส่ URL รูปภาพ');
  if(!url)return;
  if(!/^https?:\/\//i.test(url)){
   alert('กรุณาใส่ URL ที่ขึ้นต้นด้วย http:// หรือ https://');
   return;
  }
  el=document.createElement('img');
  el.src=url;
  el.alt='รูปภาพ';
 }
 if(el){
  if(type==='heading'||type==='text')el.contentEditable='true';
  canvas.appendChild(el);
 }
}

function saveProject(){
 if(current<0)return;
 projects[current]={
  name:siteName.value.trim()||'เว็บไซต์ของฉัน',
  content:canvas.innerHTML,
  bg:canvas.style.background||'#ffffff'
 };
 persist();
 alert('บันทึกเว็บไซต์แล้ว');
}

function exportProject(){
 saveProject();
 const safeName=(siteName.value||'my-website').replace(/[^\wก-๙-]/g,'-');
 const doc='<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+safeName+'</title></head><body style="font-family:Arial;padding:20px;background:'+canvas.style.background+'">'+canvas.innerHTML+'</body></html>';
 const blob=new Blob([doc],{type:'text/html'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;
 a.download=safeName+'.html';
 a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}

render();
</script>
</body>
</html>
